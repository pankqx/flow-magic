name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  content:
    name: Content and fixtures (reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install jsonschema
      - run: python tests/reference/validate_content.py

  oracle-guard:
    name: Fixtures/content/schema changes need a human label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if oracle files changed without the 'oracle-change-approved' label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD -- tests/fixtures content/concepts schemas)
          if [ -n "$changed" ]; then
            echo "Oracle files changed:"; echo "$changed"
            if echo "$LABELS" | grep -q 'oracle-change-approved'; then
              echo "Label present: allowed."
            else
              echo "::error::Add the 'oracle-change-approved' label after human review to change fixtures, content or schemas."
              exit 1
            fi
          fi

  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect app
        id: detect
        run: |
          if [ -f package.json ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet (before FM-101); skipping app checks."; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_app == 'true'
        with:
          node-version: lts/*
          cache: npm
      - if: steps.detect.outputs.has_app == 'true'
        run: npm ci
      - if: steps.detect.outputs.has_app == 'true'
        run: npm run check
      - if: steps.detect.outputs.has_app == 'true'
        run: npm run build

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect e2e
        id: detect
        run: |
          if [ -f package.json ] && grep -q '"test:e2e"' package.json; then echo "has_e2e=true" >> "$GITHUB_OUTPUT"; else echo "has_e2e=false" >> "$GITHUB_OUTPUT"; echo "No test:e2e script yet; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_e2e == 'true'
        with:
          node-version: lts/*
          cache: npm
      - if: steps.detect.outputs.has_e2e == 'true'
        run: npm ci
      - if: steps.detect.outputs.has_e2e == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.detect.outputs.has_e2e == 'true'
        run: npm run test:e2e
